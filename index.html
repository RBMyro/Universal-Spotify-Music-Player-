<!DOCTYPE html>
<html lang="en">
<head>
    <title>Spotify Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- This is the main widget card, everything else lives in it-->
    <div class="card">
        <div class="backdrop"></div>
        <div class="bar">

            <div class="brand">
                <span id="brandText">Stream Radio</span>
                <div class="subtitle" id="subtitleText">Playing: Stream Playlist</div>
            </div>

            <div class="divider"></div>

            <svg class="speaker" viewBox="0 0 30 22">
                <path class="cone" d="M2 8 H8 L15 2 V20 L8 14 H2 Z"/>
                <path class="wave w1" d="M19 7 Q22 11 19 15"/>
                <path class="wave w2" d="M23 4 Q28 11 23 18"/>
            </svg>

            <div class="track-area">
                <div class="track-name">Now Playing</div>
            </div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-thumb" id="progressThumb"></div>
    </div>
    </div>
    <button id="connectBtn">Connect</button>

    <script src="script.js"></script>
</body>
</html>
